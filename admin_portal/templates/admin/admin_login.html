<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | VIVA MIS Decision Support System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='admin_portal/css/admin_dark.css') }}?v=2.1">
</head>
<body style="background-color: var(--admin-bg-base); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;">

  <div class="card border-0 shadow-lg p-4 p-md-5" style="max-width: 440px; width: 100%; border-radius: 20px; background-color: var(--admin-bg-card); border: 1px solid var(--admin-border);">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center mb-3" style="width: 56px; height: 56px; background-color: rgba(163, 230, 53, 0.15); color: var(--admin-neon); border-radius: 14px; font-size: 1.8rem; border: 1px solid rgba(163, 230, 53, 0.3);">
        <i class="bi bi-shield-lock-fill"></i>
      </div>
      <h3 class="fw-bold mb-1" style="color: #FFF;">VIVA MIS Portal</h3>
      <p class="small text-muted">Executive Decision Support & Management Interface</p>
    </div>

    <!-- Flash message -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category if category != 'error' else 'danger' }} small py-2 mb-3 border-0" style="border-radius: 8px;">
            <i class="bi bi-exclamation-circle me-1"></i>{{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('admin_auth.login', next=request.args.get('next')) }}" method="POST">
      <div class="mb-3">
        <label class="form-label small fw-semibold text-muted">Username or Admin Email *</label>
        <div class="input-group">
          <span class="input-group-text border-end-0" style="background-color: #121815; border-color: var(--admin-border); color: #94A39D;">
            <i class="bi bi-person"></i>
          </span>
          <input type="text" name="identifier" class="form-control form-control-admin border-start-0" placeholder="admin or admin@viva.com" value="{{ identifier or '' }}" required autofocus>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label small fw-semibold text-muted">Password *</label>
        <div class="input-group">
          <span class="input-group-text border-end-0" style="background-color: #121815; border-color: var(--admin-border); color: #94A39D;">
            <i class="bi bi-key"></i>
          </span>
          <input type="password" name="password" class="form-control form-control-admin border-start-0" placeholder="••••••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn btn-admin-neon w-100 py-3 d-flex align-items-center justify-content-center gap-2">
        <i class="bi bi-box-arrow-in-right"></i>
        <span>Sign In to Executive Console</span>
      </button>
    </form>

    <div class="mt-4 pt-3 border-top text-center" style="border-color: var(--admin-border-subtle) !important;">
      <a href="{{ url_for('customer.home') }}" class="small text-muted text-decoration-none">
        <i class="bi bi-arrow-left me-1"></i> Return to Customer Purchasing Website
      </a>
    </div>
  </div>

</body>
</html>

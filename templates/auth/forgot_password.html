{% extends "base.html" %}

{% block title %}Reset Password | VIVA – Live Better{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
      <div class="card border-0 shadow-lg p-4 p-md-5" style="border-radius: var(--viva-radius-lg); background-color: var(--viva-white);">
        <div class="text-center mb-4">
          <div class="brand-icon-box mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.6rem;">
            <i class="bi bi-key-fill"></i>
          </div>
          <h2 class="h3 fw-bold mb-1" style="color: var(--viva-forest-dark);">Reset Password</h2>
          <p class="text-muted small">Enter the email registered with your account to receive password reset instructions.</p>
        </div>

        <form action="{{ url_for('auth.forgot_password') }}" method="POST">
          <div class="mb-4">
            <label class="form-label small fw-semibold">Email Address *</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0" style="border-radius: 10px 0 0 10px;"><i class="bi bi-envelope text-muted"></i></span>
              <input type="email" name="email" class="form-control form-control-viva border-start-0" placeholder="name@example.com" style="border-radius: 0 10px 10px 0;" required autofocus>
            </div>
          </div>

          <button type="submit" class="btn btn-viva-primary w-100 py-3 text-center justify-content-center">
            <span>Send Reset Instructions</span>
          </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top small text-muted">
          Remember your password? 
          <a href="{{ url_for('auth.login') }}" class="fw-bold text-success text-decoration-underline ms-1">Back to Sign In</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

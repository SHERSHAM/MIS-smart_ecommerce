{% extends "base.html" %}

{% block title %}Create Account | VIVA – Live Better{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card border-0 shadow-lg p-4 p-md-5" style="border-radius: var(--viva-radius-lg); background-color: var(--viva-white);">
        <div class="text-center mb-4">
          <div class="brand-icon-box mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.6rem;">
            <i class="bi bi-person-plus-fill"></i>
          </div>
          <h2 class="h3 fw-bold mb-1" style="color: var(--viva-forest-dark);">Create Your Account</h2>
          <p class="text-muted small">Join VIVA to enjoy curated shopping, tracking, and member offers.</p>
        </div>

        <form action="{{ url_for('auth.register', next=request.args.get('next')) }}" method="POST">
          <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">

          <div class="mb-3">
            <label class="form-label small fw-semibold">Full Name *</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0" style="border-radius: 10px 0 0 10px;"><i class="bi bi-person text-muted"></i></span>
              <input type="text" name="full_name" class="form-control form-control-viva border-start-0" placeholder="e.g. Rahul Sharma" value="{{ full_name or '' }}" style="border-radius: 0 10px 10px 0;" required autofocus>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold">Email Address *</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0" style="border-radius: 10px 0 0 10px;"><i class="bi bi-envelope text-muted"></i></span>
              <input type="email" name="email" class="form-control form-control-viva border-start-0" placeholder="e.g. rahul@example.com" value="{{ email or '' }}" style="border-radius: 0 10px 10px 0;" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold">Phone Number</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0" style="border-radius: 10px 0 0 10px;"><i class="bi bi-telephone text-muted"></i></span>
              <input type="tel" name="phone" class="form-control form-control-viva border-start-0" placeholder="e.g. +91 9876543210" value="{{ phone or '' }}" style="border-radius: 0 10px 10px 0;">
            </div>
          </div>

          <div class="row g-2 mb-3">
            <div class="col-md-6">
              <label class="form-label small fw-semibold">Password *</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0" style="border-radius: 10px 0 0 10px;"><i class="bi bi-lock text-muted"></i></span>
                <input type="password" name="password" class="form-control form-control-viva border-start-0" placeholder="Min 6 chars" minlength="6" style="border-radius: 0 10px 10px 0;" required>
              </div>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold">Confirm Password *</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0" style="border-radius: 10px 0 0 10px;"><i class="bi bi-shield-check text-muted"></i></span>
                <input type="password" name="confirm_password" class="form-control form-control-viva border-start-0" placeholder="Repeat password" minlength="6" style="border-radius: 0 10px 10px 0;" required>
              </div>
            </div>
          </div>

          <div class="form-check mb-4 small">
            <input class="form-check-input" type="checkbox" id="termsCheck" required checked>
            <label class="form-check-label text-muted" for="termsCheck">
              I agree to the <a href="{{ url_for('customer.terms') }}" class="text-success text-decoration-underline">Terms of Service</a> and <a href="{{ url_for('customer.privacy') }}" class="text-success text-decoration-underline">Privacy Policy</a>.
            </label>
          </div>

          <button type="submit" class="btn btn-viva-primary w-100 py-3 text-center justify-content-center">
            <span>Register Account</span>
            <i class="bi bi-arrow-right ms-2"></i>
          </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top small text-muted">
          Already have an account? 
          <a href="{{ url_for('auth.login', next=request.args.get('next')) }}" class="fw-bold text-success text-decoration-underline ms-1">Sign In Here</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
